<svg width="680" height="200" viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes slide-in {
        from { opacity: 0; transform: translateY(24px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes expand-letters {
        from { opacity: 0; letter-spacing: -8px; }
        to   { opacity: 1; letter-spacing: 14px; }
      }
      @keyframes glitch {
        0%,82%,100% { transform: translate(0,0); opacity:1; }
        84%  { transform: translate(-5px, 1px); opacity:.85; }
        86%  { transform: translate(5px,-2px); opacity:.85; }
        88%  { transform: translate(-3px, 2px); opacity:.9; }
        90%  { transform: translate(0,0); opacity:1; }
      }
      @keyframes glitch-r {
        0%,82%,100% { opacity:0; transform:translate(0,0); }
        84%  { opacity:.35; transform:translate(6px,-1px); }
        88%  { opacity:.2;  transform:translate(-4px,2px); }
        90%  { opacity:0; }
      }
      @keyframes glitch-b {
        0%,82%,100% { opacity:0; transform:translate(0,0); }
        84%  { opacity:.25; transform:translate(-6px,2px); }
        88%  { opacity:.15; transform:translate(4px,-1px); }
        90%  { opacity:0; }
      }
      @keyframes scan {
        0%   { transform:translateY(-4px); opacity:.5; }
        100% { transform:translateY(204px); opacity:0; }
      }
      @keyframes pulse-bar {
        0%,100% { opacity:.5; }
        50%     { opacity:1; }
      }
      @keyframes cursor-blink {
        0%,100% { opacity:1; }
        50%     { opacity:0; }
      }
      @keyframes fade-tag {
        from { opacity:0; }
        to   { opacity:.55; }
      }

      .main-name  { animation: slide-in .9s cubic-bezier(.22,1,.36,1) .15s both, glitch 6s ease-in-out 2.5s infinite; }
      .ghost-r    { animation: glitch-r 6s ease-in-out 2.5s infinite; }
      .ghost-b    { animation: glitch-b 6s ease-in-out 2.5s infinite; }
      .sub-name   { animation: expand-letters 1.1s cubic-bezier(.22,1,.36,1) 1s both; }
      .scan-line  { animation: scan 2.2s linear infinite; }
      .bar-l      { animation: pulse-bar 2s ease-in-out .3s infinite; }
      .bar-r      { animation: pulse-bar 2s ease-in-out .9s infinite; }
      .cursor     { animation: cursor-blink 1.1s step-end 1.8s infinite; }
      .tag        { animation: fade-tag .6s ease-out 2.2s both; }
    </style>
    <clipPath id="cg1"><rect x="0" y="55" width="680" height="32"/></clipPath>
    <clipPath id="cg2"><rect x="0" y="88" width="680" height="22"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="680" height="200" rx="10" fill="#0d1117"/>

  <!-- Subtle grid -->
  <line x1="0"   y1="66"  x2="680" y2="66"  stroke="#00d4ff" stroke-width=".4" opacity=".08"/>
  <line x1="0"   y1="133" x2="680" y2="133" stroke="#00d4ff" stroke-width=".4" opacity=".08"/>
  <line x1="170" y1="0"   x2="170" y2="200" stroke="#00d4ff" stroke-width=".4" opacity=".08"/>
  <line x1="340" y1="0"   x2="340" y2="200" stroke="#00d4ff" stroke-width=".4" opacity=".08"/>
  <line x1="510" y1="0"   x2="510" y2="200" stroke="#00d4ff" stroke-width=".4" opacity=".08"/>

  <!-- Accent bars -->
  <rect class="bar-l" x="38" y="46" width="2.5" height="108" fill="#00d4ff" rx="1.5"/>
  <rect class="bar-r" x="639.5" y="46" width="2.5" height="108" fill="#64ffda" rx="1.5"/>

  <!-- Corner brackets -->
  <path d="M58 34 L40 34 L40 52"  fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" opacity=".45"/>
  <path d="M622 34 L640 34 L640 52" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" opacity=".45"/>
  <path d="M58 166 L40 166 L40 148" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" opacity=".45"/>
  <path d="M622 166 L640 166 L640 148" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" opacity=".45"/>

  <!-- Scan line -->
  <rect class="scan-line" x="0" y="-3" width="680" height="5" fill="#00d4ff" opacity=".18" rx="2"/>

  <!-- Ghost red (glitch artifact) -->
  <text class="ghost-r" x="340" y="116"
    text-anchor="middle"
    font-family="'Courier New',Courier,monospace"
    font-size="76" font-weight="700"
    fill="#ff004f"
    clip-path="url(#cg1)"
    opacity="0">KHALED</text>

  <!-- Ghost blue (glitch artifact) -->
  <text class="ghost-b" x="340" y="116"
    text-anchor="middle"
    font-family="'Courier New',Courier,monospace"
    font-size="76" font-weight="700"
    fill="#0060ff"
    clip-path="url(#cg2)"
    opacity="0">KHALED</text>

  <!-- Main name -->
  <g class="main-name">
    <text x="340" y="116"
      text-anchor="middle"
      font-family="'Courier New',Courier,monospace"
      font-size="76" font-weight="700"
      fill="#00d4ff">KHALED</text>
  </g>

  <!-- Sub name -->
  <text class="sub-name"
    x="340" y="156"
    text-anchor="middle"
    font-family="'Courier New',Courier,monospace"
    font-size="17" font-weight="400"
    fill="#64ffda"
    letter-spacing="14"
    opacity="0">ELMASRY</text>

  <!-- Blinking cursor after sub-name -->
  <rect class="cursor" x="535" y="139" width="2.5" height="18" fill="#64ffda" rx="1"/>

  <!-- Small dev tag top-left -->
  <text class="tag" x="58" y="31"
    font-family="'Courier New',Courier,monospace"
    font-size="10" fill="#00d4ff" opacity="0">&lt;dev /&gt;</text>

  <!-- Small tag bottom-right -->
  <text class="tag" x="622" y="174"
    text-anchor="end"
    font-family="'Courier New',Courier,monospace"
    font-size="10" fill="#64ffda" opacity="0">v4.semester</text>
</svg>
